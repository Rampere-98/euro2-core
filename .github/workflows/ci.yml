name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: euro2
          POSTGRES_PASSWORD: euro2
          POSTGRES_DB: euro2_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U euro2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://euro2:euro2@localhost:5432/euro2_test
      DATABASE_URL: postgresql+asyncpg://euro2:euro2@localhost:5432/euro2_test
      # model-backed features fall back to rules in CI: no weight downloads
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Migrate the test database
        run: uv run alembic upgrade head
      - name: Tests (unit + integration, no model weights)
        run: uv run pytest -q -m "not model"

  app:
    name: Flutter (analyze + web build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter build web --release --wasm --base-href /app/
