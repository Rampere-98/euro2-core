<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="Catálogo, valor real y asistente para todas las monedas de 2 euros.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Euro2">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#14110d">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Euro2 · monedas de 2 €</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Splash shown while the engine and fonts load; removed on Flutter's first frame. */
    html, body { margin: 0; background: #14110d; height: 100%; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px; background: #14110d; color: #d4af37;
      font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .04em;
      transition: opacity .35s ease-out; z-index: 10; }
    #splash.gone { opacity: 0; pointer-events: none; }
    #splash .ring { width: 64px; height: 64px; border-radius: 50%;
      border: 4px solid rgba(212, 175, 55, .25); border-top-color: #d4af37;
      animation: euro2spin 1s linear infinite; }
    @keyframes euro2spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    // Keep the browser's install prompt so the app can offer an "Instalar" button.
    window.euro2InstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.euro2InstallPrompt = e;
      window.dispatchEvent(new Event('euro2-installable'));
    });
    window.euro2Install = function () {
      var p = window.euro2InstallPrompt;
      if (!p) return Promise.resolve('unavailable');
      p.prompt();
      return p.userChoice.then(function (c) { window.euro2InstallPrompt = null; return c.outcome; });
    };
    window.euro2IsStandalone = function () {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    };
  </script>
</head>
<body>
  <div id="splash"><div class="ring"></div><div>Euro2</div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.classList.add('gone');
      setTimeout(function () { s.remove(); }, 400);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
